[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldenforge"
version = "0.1.0"
description = "Transform production AI traces into high-quality Golden Datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
goldenforge = "goldenforge.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
